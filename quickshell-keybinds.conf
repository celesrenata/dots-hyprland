# Quickshell keybinds for dots-hyprland
# Based on original dots-hyprland/.config/hypr/hyprland/keybinds.conf

#! Shell/Quickshell
# Overview/Launcher
bind = Super, Super_L, exec, quickshell ipc call overview toggle || pkill fuzzel || fuzzel
bind = Super, Tab, exec, quickshell ipc call overview toggle

# Sidebars
bind = Super, A, exec, quickshell ipc call sidebarLeft toggle
bind = Super, N, exec, quickshell ipc call sidebarRight toggle

# Utilities
bind = Super, Slash, exec, quickshell ipc call cheatsheet toggle
bind = Super, V, exec, quickshell ipc call clipboard toggle
bind = Super, Period, exec, quickshell ipc call emoji toggle
bind = Super, K, exec, quickshell ipc call osk toggle

# Alternative binds
bind = Super, B, exec, quickshell ipc call sidebarLeft toggle
bind = Super, O, exec, quickshell ipc call sidebarLeft toggle
